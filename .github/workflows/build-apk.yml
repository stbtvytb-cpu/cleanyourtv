name: Build CleanYourTV APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipe build"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Launcher APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build launcher
        working-directory: launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            ./gradlew --no-daemon --stacktrace assembleRelease
          fi

      - name: Ringkasan
        if: always()
        shell: bash
        run: |
          {
            echo "### APK yang dihasilkan"
            echo ""
            echo '```'
            find . -name "*.apk" -not -path "*/intermediates/*" -exec ls -lh {} \; 2>/dev/null || echo "(tidak ada)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-${{ inputs.build_type }}-run${{ github.run_number }}
          path: launcher/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
